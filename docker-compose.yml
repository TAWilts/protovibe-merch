services:
  merch:
    build: .
    container_name: protovibe-merch
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8088}:8000"
    environment:
      SECRET_KEY: ${SECRET_KEY}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      DATA_DIR: /data
      LOCAL_DEV_MODE: ${LOCAL_DEV_MODE:-false}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-90}
      ACCOUNT_SETUP_CODE_DAYS: ${ACCOUNT_SETUP_CODE_DAYS:-14}
      PROFILE_REAUTH_SECONDS: ${PROFILE_REAUTH_SECONDS:-600}
      MFA_ISSUER: ${MFA_ISSUER:-Protovibe Merch Manager}
      EMAIL_NOTIFICATIONS_ENABLED: ${EMAIL_NOTIFICATIONS_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURITY: ${SMTP_SECURITY:-ssl}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      ADMIN_NOTIFICATION_EMAIL: ${ADMIN_NOTIFICATION_EMAIL:-}
      SMTP_TIMEOUT_SECONDS: ${SMTP_TIMEOUT_SECONDS:-8}
      # Optional scheduled-update unlock. The values remain in root-only files
      # under this read-only mount; never put either secret into .env.
      SCHEDULED_RESTART_AUTH_TOKEN_FILE: /run/protovibe-scheduled-restart/authorisation-token
      SCHEDULED_RESTART_UNLOCK_SECRET_FILE: /run/protovibe-scheduled-restart/one-time-unlock-secret
      SCHEDULED_RESTART_UNLOCK_TTL_SECONDS: ${SCHEDULED_RESTART_UNLOCK_TTL_SECONDS:-1200}
    volumes:
      # Database and automatic backups persist when the container is updated.
      # For local plaintext mode, use DATA_VOLUME=./local-data so the
      # encrypted production data/ directory is never opened as SQLite.
      - ${DATA_VOLUME:-./data}:/data
      # Disabled by default. On a NAS, point SCHEDULED_RESTART_SECRETS_DIR to
      # a root-only directory outside the project and data/ directories.
      - ${SCHEDULED_RESTART_SECRETS_DIR:-./scheduled-restart-secrets-disabled}:/run/protovibe-scheduled-restart:ro
