name: Publish release and development images

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      image_tag:
        description: Tag for a manually published test image
        required: true
        default: synology-test

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-images-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

jobs:
  test:
    uses: ./.github/workflows/test.yml

  publish:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - name: backend
            dockerfile: deploy/Dockerfile.backend
            suffix: ""
          - name: frontend
            dockerfile: deploy/Dockerfile.frontend
            suffix: "-web"
    env:
      RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.image_tag || github.ref_type == 'tag' && github.ref_name || format('development-{0}', github.sha) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          # A separate package namespace keeps the existing legacy install's
          # ghcr.io/.../protovibe-merch:latest tag untouched.
          images: ghcr.io/${{ github.repository }}-multitenant${{ matrix.suffix }}
          tags: |
            type=ref,event=tag,enable=${{ github.event_name == 'push' && github.ref_type == 'tag' }}
            type=semver,pattern={{version}},enable=${{ github.event_name == 'push' && github.ref_type == 'tag' }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ github.event_name == 'push' && github.ref_type == 'tag' }}
            type=raw,value=latest,enable=${{ github.event_name == 'push' && github.ref_type == 'tag' }}
            type=raw,value=development,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
            type=raw,value=${{ inputs.image_tag }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=sha,prefix=sha-
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          # Releases report their version tag. Every main push gets an
          # immutable development version while the moving development tag
          # lets a test server follow the newest successful push.
          build-args: |
            APP_VERSION=${{ env.RELEASE_VERSION }}
            VITE_PRIVACY_URL=${{ vars.PRIVACY_URL }}
            VITE_IMPRINT_URL=${{ vars.IMPRINT_URL }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
