name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_DATABASE: merch_test
          MARIADB_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      TEST_DATABASE_DSN: "root:root@tcp(127.0.0.1:3306)/merch_test?charset=utf8mb4&parseTime=true&loc=UTC&multiStatements=true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: backend/go.sum
      - name: Verify formatting
        working-directory: backend
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: Vet
        working-directory: backend
        run: go vet ./...
      - name: Test
        working-directory: backend
        run: go test ./... -race

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm run type-check
      - working-directory: frontend
        run: npm run test:unit
      - working-directory: frontend
        run: npm run build

  deployment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Synology Compose project
        run: docker compose --env-file deploy/.env.synology.example -f deploy/docker-compose.synology.yml config --quiet
      - name: Validate Synology update task
        run: |
          sh -n deploy/synology-update.sh deploy/tests/synology-update_test.sh
          sh deploy/tests/synology-update_test.sh
