<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Passwort zurücksetzen · Merch Manager</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
</head>
<body class="login-page">
  <main class="login-card">
    <div class="brand brand-login"><span class="brand-mark">P</span><span>Merch Manager</span></div>
    <h1>Passwort zurücksetzen</h1>
    <p>Gib den Einmalcode aus der E-Mail ein und wähle ein neues Passwort.</p>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="flash {{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}
    <form method="post" class="stack-form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label>Benutzername<input value="{{ username }}" autocomplete="username" readonly></label>
      <label>Einmalcode<input name="reset_code" autocomplete="one-time-code" maxlength="128" required autofocus></label>
      <label>Neues Passwort<input name="password" type="password" autocomplete="new-password" minlength="12" required></label>
      <label>Passwort wiederholen<input name="password_confirmation" type="password" autocomplete="new-password" minlength="12" required></label>
      <button class="primary-button full-width" type="submit">Passwort speichern</button>
    </form>
    <p class="muted"><a href="{{ url_for('login') }}">Zurück zur Anmeldung</a></p>
  </main>
</body>
</html>
