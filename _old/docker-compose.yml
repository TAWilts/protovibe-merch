services:
  merch:
    build: .
    container_name: protovibe-merch
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8089}:8000"
    environment:
      SECRET_KEY: ${SECRET_KEY}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      DATA_DIR: /data
      LOCAL_DEV_MODE: ${LOCAL_DEV_MODE:-false}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-90}
      ACCOUNT_SETUP_CODE_DAYS: ${ACCOUNT_SETUP_CODE_DAYS:-14}
      PROFILE_REAUTH_SECONDS: ${PROFILE_REAUTH_SECONDS:-600}
      MFA_ISSUER: ${MFA_ISSUER:-Protovibe Merch Manager}
      EMAIL_NOTIFICATIONS_ENABLED: ${EMAIL_NOTIFICATIONS_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURITY: ${SMTP_SECURITY:-ssl}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      ADMIN_NOTIFICATION_EMAIL: ${ADMIN_NOTIFICATION_EMAIL:-}
      SMTP_TIMEOUT_SECONDS: ${SMTP_TIMEOUT_SECONDS:-8}
    volumes:
      # Plain SQLite databases, attachments and automatic backups persist when
      # the container is updated. Use DATA_VOLUME=./local-data for a separate
      # development data set.
      - ${DATA_VOLUME:-./data}:/data
