# Production configuration for the Synology DS225+.
#
# Unlike docker-compose.yml, this file does not build source code on the NAS.
# It pulls the tested, immutable release image generated by GitHub Actions.
# MERCH_IMAGE_TAG chooses that image; its internal APP_VERSION already comes
# from the GitHub release tag used at image-build time.
# Keep the existing .env and data/ directory beside this file.
services:
  merch:
    image: ghcr.io/tawilts/protovibe-merch:${MERCH_IMAGE_TAG:-v0.3.0}
    container_name: protovibe-merch
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8088}:8000"
    environment:
      SECRET_KEY: ${SECRET_KEY}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      DATA_DIR: /data
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-90}
      UPDATE_CHECK_REPOSITORY: ${UPDATE_CHECK_REPOSITORY:-TAWilts/protovibe-merch}
      UPDATE_CHECK_TOKEN: ${UPDATE_CHECK_TOKEN:-}
      UPDATE_CHECK_TIMEOUT_SECONDS: ${UPDATE_CHECK_TIMEOUT_SECONDS:-3}
      UPDATE_CHECK_CACHE_SECONDS: ${UPDATE_CHECK_CACHE_SECONDS:-21600}
    volumes:
      # Database and automatic backups persist through every image update.
      - ./data:/data
      - ./imports:/import:ro
